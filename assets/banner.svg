<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.8" />
    </pattern>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 35px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      50% { transform: translate(-50px, -30px) scale(0.95); }
      100% { transform: translate(0px, 0px) scale(1.1); }
    }
    @keyframes pulseDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .orb-1 {
      animation: floatOrb1 12s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 14s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: pulseDash 3s linear infinite;
    }
    .blink-node {
      animation: nodeBlink 2.5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.45">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#0284c7" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="280" r="160" fill="#7c3aed" filter="url(#glow)" />
    <circle class="orb-1" cx="620" cy="350" r="110" fill="#059669" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Dynamic Animated Tech Network Connections (Background) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 80,320 Q 300,240 500,320 T 920,270 T 1120,330" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 100,80 Q 400,160 700,90 T 1100,120" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="300" cy="240" r="5" fill="#38bdf8" class="blink-node" />
    <circle cx="500" cy="320" r="6" fill="#818cf8" class="blink-node" style="animation-delay: 0.8s;" />
    <circle cx="920" cy="270" r="5" fill="#c084fc" class="blink-node" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Container Box (Translucent Glassmorphism) -->
  <rect x="70" y="45" width="1060" height="310" rx="20" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" />

  <!-- Top Decorative Tags / Status Header -->
  <g transform="translate(110, 85)">
    <rect x="0" y="0" width="180" height="30" rx="15" fill="#0369a1" fill-opacity="0.35" stroke="#0284c7" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#38bdf8" />
    <text x="28" y="20" fill="#7dd3fc" class="badge-pill">EPHEMERAL TESTING</text>

    <rect x="195" y="0" width="180" height="30" rx="15" fill="#581c87" fill-opacity="0.35" stroke="#9333ea" stroke-width="1" />
    <circle cx="210" cy="15" r="4" fill="#c084fc" />
    <text x="223" y="20" fill="#e9d5ff" class="badge-pill">CLOUD EMULATION</text>

    <rect x="390" y="0" width="185" height="30" rx="15" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-width="1" />
    <circle cx="405" cy="15" r="4" fill="#34d399" />
    <text x="418" y="20" fill="#a7f3d0" class="badge-pill">PREVIEW SANDBOXES</text>
  </g>

  <!-- Main Titles (Crisp Foreground, High Contrast) -->
  <text class="title-text" x="110" y="175" font-size="44" fill="url(#textGrad)" filter="url(#slightGlow)">
    Awesome Developer Sandbox
  </text>
  <text class="title-text" x="110" y="228" font-size="38" fill="#f8fafc">
    &amp; Testing Environment Ecosystem
  </text>

  <!-- Subtitle -->
  <text class="subtitle-text" x="110" y="275" font-size="18" fill="#94a3b8">
    Curated list of SaaS platforms, cloud emulators, preview environments &amp; disposable dev setups.
  </text>

  <!-- Bottom Interactive/Status Pill Row -->
  <g transform="translate(110, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="17" fill="#cbd5e1" class="badge-pill" font-size="12">⚡ Instant Previews</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="17" transform="translate(155, 0)" fill="#cbd5e1" class="badge-pill" font-size="12">🛡️ Data Isolation</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="17" transform="translate(300, 0)" fill="#cbd5e1" class="badge-pill" font-size="12">☁️ LocalStack &amp; More</text>

    <!-- Pill 4 -->
    <rect x="455" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="17" transform="translate(455, 0)" fill="#cbd5e1" class="badge-pill" font-size="12">☸️ Kubernetes Native</text>
  </g>

  <!-- Right Decorative Isometric / Cubes Illustration -->
  <g transform="translate(930, 185)" opacity="0.85">
    <!-- Center floating box -->
    <polygon points="0,-45 42,-22 0,0 -42,-22" fill="#38bdf8" opacity="0.9" />
    <polygon points="-42,-22 0,0 0,48 -42,26" fill="#0284c7" opacity="0.8" />
    <polygon points="0,0 42,-22 42,26 0,48" fill="#0369a1" opacity="0.95" />

    <!-- Left lower box -->
    <polygon points="-55,10 -13,32 -55,54 -97,32" fill="#a855f7" opacity="0.85" />
    <polygon points="-97,32 -55,54 -55,98 -97,76" fill="#7e22ce" opacity="0.75" />
    <polygon points="-55,54 -13,32 -13,76 -55,98" fill="#6b21a8" opacity="0.9" />

    <!-- Right lower box -->
    <polygon points="55,10 97,32 55,54 13,32" fill="#34d399" opacity="0.85" />
    <polygon points="13,32 55,54 55,98 13,76" fill="#059669" opacity="0.75" />
    <polygon points="55,54 97,32 97,76 55,98" fill="#047857" opacity="0.9" />
  </g>
</svg>
